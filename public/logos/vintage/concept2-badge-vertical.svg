<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 160" width="140" height="160" role="img" aria-label="AcresxManna vintage badge logo">
  <defs>
    <style>
      .vintage-text { font-family: 'Georgia', 'Times New Roman', serif; }
    </style>
  </defs>
  
  <!-- Outer badge shape -->
  <ellipse cx="70" cy="80" rx="60" ry="70" fill="#faf6f0" stroke="#a85a32" stroke-width="3" />
  <ellipse cx="70" cy="80" rx="52" ry="62" fill="none" stroke="#a85a32" stroke-width="2" stroke-dasharray="6,3" />
  
  <!-- Top arc text -->
  <path id="topArc" d="M 15,60 A 55,55 0 0,1 125,60" fill="none" />
  <text class="vintage-text" font-size="12" font-weight="bold" fill="#c66d3a" letter-spacing="2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">ACRES x MANNA</textPath>
  </text>
  
  <!-- Center icon - wheat/sheaf -->
  <g transform="translate(70, 85)">
    <!-- Main stem -->
    <line x1="0" y1="-25" x2="0" y2="25" stroke="#2d5a3a" stroke-width="3" />
    <!-- Wheat grains left -->
    <ellipse cx="-8" cy="-15" rx="6" ry="3" fill="#d97706" transform="rotate(-30 -8 -15)" />
    <ellipse cx="-10" cy="-5" rx="5" ry="2.5" fill="#d97706" transform="rotate(-25 -10 -5)" />
    <ellipse cx="-8" cy="5" rx="5" ry="2.5" fill="#d97706" transform="rotate(-20 -8 5)" />
    <!-- Wheat grains right -->
    <ellipse cx="8" cy="-15" rx="6" ry="3" fill="#d97706" transform="rotate(30 8 -15)" />
    <ellipse cx="10" cy="-5" rx="5" ry="2.5" fill="#d97706" transform="rotate(25 10 -5)" />
    <ellipse cx="8" cy="5" rx="5" ry="2.5" fill="#d97706" transform="rotate(20 8 5)" />
  </g>
  
  <!-- Bottom arc text -->
  <path id="bottomArc" d="M 20,110 A 50,50 0 0,0 120,110" fill="none" />
  <text class="vintage-text" font-size="9" fill="#6b7280" letter-spacing="1.5">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">AFRICAN AGRO-PROCESSING</textPath>
  </text>
  
  <!-- Year -->
  <text x="70" y="145" class="vintage-text" font-size="11" font-weight="bold" fill="#a85a32" text-anchor="middle">EST. 2024</text>
</svg>