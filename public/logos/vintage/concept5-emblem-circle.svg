<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="AcresxManna vintage circular emblem">
  <defs>
    <style>
      .emblem-text { font-family: 'Georgia', 'Times New Roman', serif; }
    </style>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="60" cy="60" r="55" fill="#faf6f0" stroke="#a85a32" stroke-width="3" />
  <circle cx="60" cy="60" r="48" fill="none" stroke="#a85a32" stroke-width="1.5" />
  
  <!-- Inner decorative ring -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" />
  
  <!-- Central wheat/sheaf icon -->
  <g transform="translate(60, 60)">
    <!-- Main stem -->
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#2d5a3a" stroke-width="2.5" />
    
    <!-- Left grains -->
    <ellipse cx="-6" cy="-12" rx="5" ry="2.5" fill="#d97706" transform="rotate(-25 -6 -12)" />
    <ellipse cx="-8" cy="-4" rx="4" ry="2" fill="#d97706" transform="rotate(-20 -8 -4)" />
    <ellipse cx="-6" cy="4" rx="4" ry="2" fill="#d97706" transform="rotate(-15 -6 4)" />
    
    <!-- Right grains -->
    <ellipse cx="6" cy="-12" rx="5" ry="2.5" fill="#d97706" transform="rotate(25 6 -12)" />
    <ellipse cx="8" cy="-4" rx="4" ry="2" fill="#d97706" transform="rotate(20 8 -4)" />
    <ellipse cx="6" cy="4" rx="4" ry="2" fill="#d97706" transform="rotate(15 6 4)" />
    
    <!-- Top grain -->
    <ellipse cx="0" cy="-18" rx="4" ry="2" fill="#d97706" />
  </g>
  
  <!-- Top text -->
  <path id="topPath" d="M 18,30 A 42,42 0 0,1 102,30" fill="none" />
  <text class="emblem-text" font-size="10" font-weight="bold" fill="#c66d3a" letter-spacing="1.5">
    <textPath href="#topPath" startOffset="50%" text-anchor="middle">ACRES x MANNA</textPath>
  </text>
  
  <!-- Bottom text -->
  <path id="bottomPath" d="M 20,95 A 40,40 0 0,0 100,95" fill="none" />
  <text class="emblem-text" font-size="8" fill="#6b7280" letter-spacing="1">
    <textPath href="#bottomPath" startOffset="50%" text-anchor="middle">AFRICAN FOODS</textPath>
  </text>
  
  <!-- Side decorative dots -->
  <circle cx="60" cy="18" r="2" fill="#a85a32" />
  <circle cx="60" cy="102" r="2" fill="#a85a32" />
</svg>