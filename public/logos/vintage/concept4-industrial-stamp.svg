<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 100" width="260" height="100" role="img" aria-label="AcresxManna industrial stamp logo">
  <defs>
    <style>
      .industrial { font-family: 'Courier New', monospace; }
    </style>
  </defs>
  
  <!-- Stamp border with rough edges -->
  <rect x="5" y="5" width="250" height="90" rx="4" fill="none" stroke="#a85a32" stroke-width="3" />
  <rect x="12" y="12" width="236" height="76" rx="2" fill="none" stroke="#a85a32" stroke-width="1.5" stroke-dasharray="5,3" />
  
  <!-- Industrial-style text -->
  <text x="130" y="45" class="industrial" font-size="24" font-weight="bold" fill="#c66d3a" text-anchor="middle" letter-spacing="4">
    ACRES
  </text>
  <text x="130" y="65" class="industrial" font-size="24" font-weight="bold" fill="#2d5a3a" text-anchor="middle" letter-spacing="4">
    MANNA
  </text>
  
  <!-- Small 'x' separator -->
  <text x="130" y="56" class="industrial" font-size="16" fill="#d97706" text-anchor="middle">×</text>
  
  <!-- Corner stamps -->
  <rect x="8" y="8" width="8" height="8" fill="#a85a32" opacity="0.3" />
  <rect x="244" y="8" width="8" height="8" fill="#a85a32" opacity="0.3" />
  <rect x="8" y="84" width="8" height="8" fill="#a85a32" opacity="0.3" />
  <rect x="244" y="84" width="8" height="8" fill="#a85a32" opacity="0.3" />
  
  <!-- Bottom info -->
  <text x="130" y="88" class="industrial" font-size="9" fill="#6b7280" text-anchor="middle" letter-spacing="2">
    QUALITY AFRICAN FOODS · NIGERIA
  </text>
</svg>