<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Packaging icon - product box">
  <defs>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4338ca" />
      <stop offset="100%" style="stop-color:#6366f1" />
    </linearGradient>
  </defs>
  <!-- Box back face -->
  <path d="M100 40 L160 70 L160 150 L100 180 L40 150 L40 70 Z" fill="#4338ca" opacity="0.5" />
  
  <!-- Box top face -->
  <path d="M100 40 L160 70 L100 100 L40 70 Z" fill="#6366f1" />
  
  <!-- Box front face -->
  <path d="M40 70 L100 100 L100 180 L40 150 Z" fill="#4f46e5" />
  
  <!-- Box right face -->
  <path d="M100 100 L160 70 L160 150 L100 180 Z" fill="#4338ca" />
  
  <!-- Box edges -->
  <path d="M100 40 L100 100 M100 100 L40 70 M100 100 L160 70" stroke="#818cf8" stroke-width="2" fill="none" />
  
  <!-- Tape/label on top -->
  <rect x="70" y="65" width="60" height="8" fill="#c7d2fe" rx="1" />
  
  <!-- Box label on front -->
  <rect x="55" y="115" width="40" height="30" fill="#e0e7ff" rx="2" />
  <line x1="60" y1="125" x2="90" y2="125" stroke="#4338ca" stroke-width="2" stroke-linecap="round" />
  <line x1="60" y1="132" x2="80" y2="132" stroke="#4338ca" stroke-width="2" stroke-linecap="round" />
  
  <!-- Quality seal badge -->
  <circle cx="130" cy="135" r="12" fill="#818cf8" />
  <path d="M125 135 L128 138 L135 131" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
</svg>