<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Food icon - prepared meal plate">
  <defs>
    <linearGradient id="food-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#d97706" />
      <stop offset="100%" style="stop-color:#fbbf24" />
    </linearGradient>
  </defs>
  <!-- Plate -->
  <ellipse cx="100" cy="140" rx="70" ry="25" fill="#f5f5f4" />
  <ellipse cx="100" cy="135" rx="65" ry="22" fill="#fff" />
  <ellipse cx="100" cy="135" rx="55" ry="18" fill="#fafaf9" />
  
  <!-- Rice/pile -->
  <ellipse cx="100" cy="125" rx="35" ry="15" fill="#fef3c7" />
  <ellipse cx="95" cy="120" rx="25" ry="10" fill="#fef9c3" />
  <ellipse cx="105" cy="118" rx="20" ry="8" fill="#fefce8" />
  
  <!-- Tomato slices -->
  <circle cx="70" cy="130" r="18" fill="#ef4444" />
  <circle cx="70" cy="130" r="12" fill="#fca5a5" opacity="0.5" />
  <circle cx="68" cy="128" r="3" fill="#fef2f2" />
  <circle cx="73" cy="132" r="2" fill="#fef2f2" />
  
  <circle cx="130" cy="125" r="15" fill="#ef4444" />
  <circle cx="130" cy="125" r="10" fill="#fca5a5" opacity="0.5" />
  <circle cx="128" cy="123" r="2.5" fill="#fef2f2" />
  
  <!-- Vegetable garnish -->
  <path d="M85 115 Q90 105 95 115 Q100 105 105 115" stroke="#22c55e" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M110 120 Q115 110 120 120" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round" />
  
  <!-- Steam -->
  <path d="M90 100 Q85 90 90 80" stroke="#fdba74" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6" />
  <path d="M100 95 Q95 85 100 75" stroke="#fdba74" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5" />
  <path d="M110 100 Q115 90 110 80" stroke="#fdba74" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6" />
</svg>