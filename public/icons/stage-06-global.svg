<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Global markets icon - world globe">
  <defs>
    <linearGradient id="globe-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4338ca" />
      <stop offset="100%" style="stop-color:#6366f1" />
    </linearGradient>
  </defs>
  <!-- Globe circle -->
  <circle cx="100" cy="100" r="65" fill="#4338ca" opacity="0.1" />
  <circle cx="100" cy="100" r="55" fill="none" stroke="#4338ca" stroke-width="3" />
  
  <!-- Latitude lines -->
  <ellipse cx="100" cy="100" rx="55" ry="15" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.6" />
  <ellipse cx="100" cy="100" rx="55" ry="35" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.6" />
  
  <!-- Longitude lines -->
  <path d="M100 45 Q60 100 100 155" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.6" />
  <path d="M100 45 Q140 100 100 155" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.6" />
  <path d="M45 100 L155 100" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.6" />
  
  <!-- Continents (stylized) -->
  <!-- Africa representation -->
  <path d="M95 70 Q85 80 90 95 Q95 110 85 120 Q80 125 85 130 L95 125 Q100 115 95 100 Q90 85 95 70" fill="#4338ca" opacity="0.4" />
  
  <!-- Europe/Asia representation -->
  <path d="M105 65 Q115 70 120 80 Q125 75 130 80 Q135 85 130 90 Q125 85 120 90 Q115 95 110 90 Q105 85 105 65" fill="#4338ca" opacity="0.4" />
  
  <!-- Americas representation -->
  <path d="M60 75 Q55 85 60 100 Q65 110 60 125 Q55 130 60 135 L70 130 Q75 115 70 100 Q65 85 60 75" fill="#4338ca" opacity="0.4" />
  
  <!-- Location pins -->
  <circle cx="70" cy="80" r="6" fill="#6366f1" />
  <circle cx="70" cy="80" r="3" fill="#fff" />
  
  <circle cx="130" cy="85" r="6" fill="#6366f1" />
  <circle cx="130" cy="85" r="3" fill="#fff" />
  
  <circle cx="95" cy="120" r="6" fill="#6366f1" />
  <circle cx="95" cy="120" r="3" fill="#fff" />
  
  <!-- Connection lines between pins -->
  <path d="M70 80 Q100 90 130 85" stroke="#6366f1" stroke-width="2" fill="none" stroke-dasharray="4,4" opacity="0.5" />
  <path d="M70 80 Q85 100 95 120" stroke="#6366f1" stroke-width="2" fill="none" stroke-dasharray="4,4" opacity="0.5" />
  <path d="M130 85 Q115 105 95 120" stroke="#6366f1" stroke-width="2" fill="none" stroke-dasharray="4,4" opacity="0.5" />
</svg>