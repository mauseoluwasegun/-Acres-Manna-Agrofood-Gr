<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Harvest icon - wheat stalk">
  <defs>
    <linearGradient id="harvest-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#d97706" />
      <stop offset="100%" style="stop-color:#fbbf24" />
    </linearGradient>
  </defs>
  <!-- Main stem -->
  <path d="M100 180 L100 40" stroke="#d97706" stroke-width="6" fill="none" stroke-linecap="round" />
  
  <!-- Wheat grains - left side -->
  <ellipse cx="75" cy="60" rx="15" ry="8" fill="#fbbf24" transform="rotate(-30 75 60)" />
  <ellipse cx="70" cy="80" rx="14" ry="7" fill="#f59e0b" transform="rotate(-25 70 80)" />
  <ellipse cx="68" cy="100" rx="13" ry="7" fill="#fbbf24" transform="rotate(-20 68 100)" />
  <ellipse cx="70" cy="120" rx="12" ry="6" fill="#f59e0b" transform="rotate(-15 70 120)" />
  <ellipse cx="75" cy="140" rx="11" ry="6" fill="#fbbf24" transform="rotate(-10 75 140)" />
  
  <!-- Wheat grains - right side -->
  <ellipse cx="125" cy="60" rx="15" ry="8" fill="#fbbf24" transform="rotate(30 125 60)" />
  <ellipse cx="130" cy="80" rx="14" ry="7" fill="#f59e0b" transform="rotate(25 130 80)" />
  <ellipse cx="132" cy="100" rx="13" ry="7" fill="#fbbf24" transform="rotate(20 132 100)" />
  <ellipse cx="130" cy="120" rx="12" ry="6" fill="#f59e0b" transform="rotate(15 130 120)" />
  <ellipse cx="125" cy="140" rx="11" ry="6" fill="#fbbf24" transform="rotate(10 125 140)" />
  
  <!-- Top wheat head -->
  <ellipse cx="100" cy="35" rx="8" ry="5" fill="#fbbf24" />
  <ellipse cx="92" cy="42" rx="7" ry="4" fill="#f59e0b" transform="rotate(-15 92 42)" />
  <ellipse cx="108" cy="42" rx="7" ry="4" fill="#f59e0b" transform="rotate(15 108 42)" />
  
  <!-- Stem detail lines -->
  <path d="M100 160 L95 155" stroke="#b45309" stroke-width="2" stroke-linecap="round" />
  <path d="M100 140 L96 137" stroke="#b45309" stroke-width="2" stroke-linecap="round" />
  <path d="M100 120 L96 118" stroke="#b45309" stroke-width="2" stroke-linecap="round" />
  <path d="M100 100 L97 99" stroke="#b45309" stroke-width="2" stroke-linecap="round" />
  <path d="M100 80 L98 80" stroke="#b45309" stroke-width="2" stroke-linecap="round" />
</svg>