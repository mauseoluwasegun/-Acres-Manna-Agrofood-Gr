<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Agriculture icon - sprouting seed">
  <defs>
    <linearGradient id="agri-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#166534" />
      <stop offset="100%" style="stop-color:#22c55e" />
    </linearGradient>
  </defs>
  <!-- Seed/soil mound -->
  <ellipse cx="100" cy="165" rx="60" ry="15" fill="#166534" opacity="0.3" />
  <path d="M60 165 Q100 145 140 165" fill="#166534" opacity="0.4" />
  
  <!-- Main stem -->
  <path d="M100 150 Q100 120 100 80" stroke="#22c55e" stroke-width="8" fill="none" stroke-linecap="round" />
  
  <!-- Left leaf -->
  <path d="M100 120 Q70 110 55 90 Q65 100 75 115 Q85 125 100 120" fill="#22c55e" />
  <path d="M100 120 Q75 115 60 100" stroke="#166534" stroke-width="2" fill="none" stroke-linecap="round" />
  
  <!-- Right leaf -->
  <path d="M100 105 Q130 95 145 75 Q135 85 125 100 Q115 115 100 105" fill="#22c55e" />
  <path d="M100 105 Q125 100 140 85" stroke="#166534" stroke-width="2" fill="none" stroke-linecap="round" />
  
  <!-- Top leaf -->
  <path d="M100 80 Q85 65 75 50 Q90 60 95 75 Q100 80 100 80" fill="#22c55e" />
  <path d="M100 80 Q88 70 80 58" stroke="#166534" stroke-width="2" fill="none" stroke-linecap="round" />
  
  <!-- Seed sprout base -->
  <ellipse cx="100" cy="155" rx="12" ry="8" fill="#14532d" />
</svg>